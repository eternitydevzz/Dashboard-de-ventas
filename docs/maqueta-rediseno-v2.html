*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;transition:background .3s,color .3s}
button,select,input{font:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
/* ---------- barra de la maqueta (igual en las dos) ---------- */
.barra-maq{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:rgb(10 10 14/.92);color:#e9ecf5;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid rgb(255 255 255/.08);font-size:13px}
.barra-maq .seg{display:flex;max-width:100%;overflow-x:auto;background:rgb(255 255 255/.06);border-radius:10px;padding:3px}
.barra-maq .seg button{border:0;background:none;color:#9aa3b8;padding:6px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}
.barra-maq .seg button.on{background:#fff;color:#0b0d12;font-weight:600}
.barra-maq .aviso{color:#7d869c;margin-left:auto;font-size:12px}
main{max-width:1240px;margin:0 auto;padding:24px 16px 80px}

/* ================= PROPUESTA A · CENTRO DE CONTROL ================= */
body.A{--bg:#05060a;--card:#0c0f16;--card2:#11151f;--line:#1c2230;--line2:#283044;--tx:#e8ecf6;--tx2:#9aa4ba;--tx3:#5f6a83;--lima:#b8ff3c;--cian:#38e1ff;--rojo:#ff4d63;--ambar:#ffb02e;--violeta:#9b7bff;background:var(--bg);color:var(--tx);
 background-image:radial-gradient(700px 400px at 85% -10%,rgb(56 225 255/.10),transparent 70%),radial-gradient(600px 400px at 0% 0%,rgb(184 255 60/.06),transparent 70%),linear-gradient(rgb(255 255 255/.025) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255/.025) 1px,transparent 1px);background-size:auto,auto,32px 32px,32px 32px;background-attachment:fixed}
.A .cab{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.A h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.03em}
.A .ruta{color:var(--tx3);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.A .vivo{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--lima);border:1px solid rgb(184 255 60/.25);background:rgb(184 255 60/.06);padding:5px 10px;border-radius:99px}
.A .led{width:8px;height:8px;border-radius:99px;background:var(--lima);box-shadow:0 0 10px var(--lima);flex-shrink:0}
.A .led.pulso{animation:pulso 1.6s ease-in-out infinite}
.A .led.ambar{background:var(--ambar);box-shadow:0 0 10px var(--ambar)}.A .led.rojo{background:var(--rojo);box-shadow:0 0 10px var(--rojo)}.A .led.gris{background:var(--tx3);box-shadow:none}
@keyframes pulso{50%{opacity:.35}}
.A .pest{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.A .pest button{border:0;background:none;color:var(--tx2);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.A .pest button.on{color:var(--tx);border-color:var(--lima)}
.A .panel{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;position:relative}
.A .eti{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.A .tira{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px;background:var(--card)}
.A .tira>div{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.A .tira>div:last-child{border-right:0}
.A .num{font-family:"JetBrains Mono",monospace;font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin-top:6px}
.A .det{font-size:12px;color:var(--tx3);margin-top:2px}
.A .sube{color:var(--lima)}.A .baja{color:var(--rojo)}
.A .rejilla{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr));margin-bottom:14px}
.A .c4{grid-column:span 4}.A .c5{grid-column:span 5}.A .c6{grid-column:span 6}.A .c7{grid-column:span 7}.A .c8{grid-column:span 8}.A .c12{grid-column:span 12}
.A .chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;border:1px solid var(--line2);color:var(--tx2);white-space:nowrap}
.A .chip.lima{color:var(--lima);border-color:rgb(184 255 60/.3);background:rgb(184 255 60/.06)}.A .chip.ambar{color:var(--ambar);border-color:rgb(255 176 46/.3);background:rgb(255 176 46/.06)}
.A .btn{border:1px solid var(--line2);background:var(--card2);color:var(--tx);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:12px;white-space:nowrap}
.A .btn.pri{background:var(--lima);color:#0a0d05;border-color:transparent;font-weight:600}
.A .btn:hover{border-color:var(--tx3)}
.A .hm{width:100%;border-collapse:separate;border-spacing:3px}
.A .hm td{height:26px;border-radius:4px;min-width:14px}
.A .hm .n{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--tx2);text-align:right;padding-left:8px;white-space:nowrap}
.A .hm .nom{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;padding-right:10px;font-size:13px}
.A .hm tr.fila-e{cursor:pointer}.A .hm tr.fila-e:hover .nom{color:var(--lima)}
.A .hm th{font-weight:400;font-size:10px;color:var(--tx3);font-family:"JetBrains Mono",monospace}
.A .detalle{border-top:1px dashed var(--line2);margin-top:12px;padding-top:12px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.A .caja{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:rgb(255 255 255/.015)}
.A .dir{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--tx2);background:#07090e;border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.A .run{display:grid;grid-template-columns:auto minmax(0,1.3fr) minmax(0,2fr) auto;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.A .run:hover,.A .run.sel{background:rgb(255 255 255/.025)}
.A .run.sel{box-shadow:inset 2px 0 0 var(--lima)}
.A .cadena{display:flex;align-items:center;gap:0;min-width:0;overflow:hidden}
.A .nodo{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:1px solid;flex-shrink:0}
.A .enlace{height:2px;width:14px;background:var(--line2);flex-shrink:0}
.A .term{font-family:"JetBrains Mono",monospace;font-size:12px;background:#06080c;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--tx2);line-height:1.7}
.A .term .ok{color:var(--lima)}.A .term .k{color:var(--cian)}.A .term .w{color:var(--ambar)}
.A .lista .item{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.A .lista .item:last-child{border-bottom:0}
.A .barrita{flex:1 1 120px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;min-width:60px}.A .barrita i{display:block;height:100%;background:linear-gradient(90deg,var(--cian),var(--lima));border-radius:99px}
.A .apilada{display:flex;height:34px;border-radius:8px;overflow:hidden;gap:2px}
.A .apilada div{display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:600;color:#06080c;white-space:nowrap;overflow:hidden}
.A .nota{font-size:12px;color:var(--tx3);margin:8px 0 0}
.A .aviso-a{border:1px solid rgb(255 176 46/.25);background:rgb(255 176 46/.05);color:var(--ambar);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;margin-bottom:14px}
.A svg text{font-family:Inter,system-ui,sans-serif}

/* ================= PROPUESTA B · ANALYTICS PREMIUM ================= */
body.B{--bg:#f6f7fb;--card:#fff;--line:#e8eaf2;--tx:#0b0d12;--tx2:#4a5168;--tx3:#8a91a8;--ind:#5b5bf6;--rosa:#f0568c;--verde:#12b886;--ambar:#f59f00;--cielo:#3b9cff;background:var(--bg);color:var(--tx)}
.B .hero{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:22px}
.B h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.04em}
.B .ruta{color:var(--tx3);font-size:13px;font-weight:500}
.B .pest{display:inline-flex;background:#eceef6;border-radius:12px;padding:4px;gap:2px;margin-bottom:22px;flex-wrap:wrap}
.B .pest button{border:0;background:none;color:var(--tx2);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500}
.B .pest button.on{background:#fff;color:var(--tx);box-shadow:0 1px 2px rgb(16 24 40/.08),0 2px 8px rgb(16 24 40/.06)}
.B .insight{background:linear-gradient(120deg,#1b1b3a,#3a2a6b 55%,#6b2f5f);color:#fff;border-radius:20px;padding:22px 24px;margin-bottom:18px;position:relative;overflow:hidden}
.B .insight::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgb(240 86 140/.45),transparent 70%)}
.B .insight .t{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;font-weight:600}
.B .insight .frase{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:6px;max-width:760px;position:relative;z-index:1}
.B .insight .frase b{background:linear-gradient(90deg,#ffd27a,#ff9ac0);-webkit-background-clip:text;background-clip:text;color:transparent}
.B .insight .mas{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:13px;opacity:.85;position:relative;z-index:1}
.B .tarj{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:0 1px 2px rgb(16 24 40/.04);min-width:0}
.B .rej{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr));margin-bottom:16px}
.B .c3{grid-column:span 3}.B .c4{grid-column:span 4}.B .c5{grid-column:span 5}.B .c6{grid-column:span 6}.B .c7{grid-column:span 7}.B .c8{grid-column:span 8}.B .c12{grid-column:span 12}
.B .lbl{font-size:13px;color:var(--tx2);font-weight:500}

.B .delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle}
.B .delta.up{background:#e6f8f1;color:#0a8a63}.B .delta.down{background:#fdecef;color:#c8314f}.B .delta.eq{background:#eef0f6;color:var(--tx2)}
.B .sub{font-size:12px;color:var(--tx3);margin-top:4px}
.B .tit{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0 0 2px}
.B table{width:100%;border-collapse:collapse}
.B th{text-align:left;font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line)}
.B td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}

.B .pill i{width:6px;height:6px;border-radius:99px;background:currentColor}
.B .cuota{height:8px;border-radius:99px;background:#eef0f6;overflow:hidden;min-width:80px}.B .cuota i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ind),var(--rosa))}
.B .btn{border:1px solid var(--line);background:#fff;color:var(--tx);border-radius:10px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.B .btn.pri{background:var(--tx);color:#fff;border-color:var(--tx)}
.B .nota{font-size:12px;color:var(--tx3);margin-top:8px}

.B .paso-t{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.B .paso-t span{font-size:11px;font-weight:600;padding:4px 9px;border-radius:8px;background:#f1f2f8;color:var(--tx2)}
.B .paso-t em{color:var(--tx3);font-style:normal}
.B .exp td{background:#fafbff}
.B svg text{font-family:Inter,system-ui,sans-serif}
.oculto{display:none!important}

}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  </div>
  <div class="tarj"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:8px"><div><p class="tit">Tus Entradas</p><div class="sub">Ordenadas por envíos de los últimos 7 días · pulsa una para abrirla</div></div><button class="btn pri">＋ Conectar landing</button></div>
   <div style="overflow-x:auto"><table><thead><tr><th>Entrada</th><th>Estado</th><th class="solo-ancho">Últimos 14 días</th><th style="text-align:right">Envíos 7 días</th><th class="solo-ancho">Cuota</th><th style="text-align:right">Leads total</th></tr></thead><tbody>
   ${[...E].map((e,i)=>({e,i})).sort((a,b)=>suma(b.e.dias.slice(-7))-suma(a.e.dias.slice(-7))).map(({e,i})=>{const s=suma(e.dias.slice(-7)), ant=suma(e.dias.slice(0,7)); return `<tr class="click" onclick="expB=expB===${i}?-1:${i};pintar()"><td><div style="font-weight:600">${esc(e.nombre)}</div><div class="sub">último hace ${hace(e.ultimo)}</div></td>
    <td>${estadoE(e)==="ok"?'<span class="pill ok"><i></i>Recibiendo</span>':estadoE(e)==="prueba"?'<span class="pill amb"><i></i>En prueba</span>':'<span class="pill gris"><i></i>Apagada</span>'}</td>
    <td class="solo-ancho">${spark(e.dias,estadoE(e)==="prueba"?"#f59f00":"#5b5bf6")}</td><td style="text-align:right;font-weight:700">${s}${delta(s,ant)}</td>
    <td class="solo-ancho" style="width:140px"><div class="cuota"><i style="width:${s7?s/s7*100:0}%"></i></div><div class="sub">${pct(s,s7||1,0)}</div></td><td style="text-align:right;color:var(--tx2)">${fmt(e.leads)}</td></tr>
    ${expB===i?`<tr class="exp"><td colspan="6"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><code style="background:#eef0f6;border-radius:8px;padding:7px 10px;font-size:12px">…/api/webhooks/entrada/••••••</code><button class="btn pri">Copiar dirección</button>${e.wf?.modo==="prueba"?'<button class="btn">Pasar a real</button><button class="btn">Parar la prueba</button>':""}<button class="btn">Últimos leads</button><button class="btn">Ajustes y Qué hacer en GHL</button><button class="btn">Para el programador</button></div></td></tr>`:""}`;}).join("")}
   </tbody></table></div></div>`;
};
B.workflows = () => {
  const W=D.workflows, real=W.filter(w=>w.modo==="real"&&w.encendido), prueba=W.filter(w=>w.modo==="prueba"&&w.encendido);
  const gauge=(a,b)=>{const t=a+b,v=t?a/t:0,r=40,c=Math.PI*r; return `<svg width="110" height="66" viewBox="0 0 110 66"><path d="M15 58 A40 40 0 0 1 95 58" fill="none" stroke="#eef0f6" stroke-width="10" stroke-linecap="round"/><path d="M15 58 A40 40 0 0 1 95 58" fill="none" stroke="${t?"#12b886":"#e8eaf2"}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${v*c} ${c}"/><text x="55" y="54" text-anchor="middle" font-size="16" font-weight="800" fill="#0b0d12">${t?Math.round(v*100)+"%":"—"}</text></svg>`;};
  return `<div class="insight"><div class="t">Resumen</div><div class="frase"><b>${real.length} workflows en real</b> ya mandan a GHL sin un solo error, y ${prueba.length} están en prueba comparando antes de dar el salto.</div><div class="mas"><span>${fmt(suma(W.map(w=>w.ejec)))} ejecuciones</span><span>${suma(W.map(w=>w.esperando))} esperando</span><span>${W.filter(w=>!w.encendido).length} apagado</span></div></div>
  <div class="rej">${W.map(w=>`<div class="tarj c4" style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div style="min-width:0"><p class="tit" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(w.nombre)}</p><div class="sub">${w.disparador==="cita"?"Cuando se agenda una cita":"Cuando llega un lead"}</div></div>${!w.encendido?'<span class="pill gris"><i></i>Apagado</span>':w.modo==="real"?'<span class="pill ok"><i></i>Real</span>':'<span class="pill amb"><i></i>Prueba</span>'}</div>
    <div class="paso-t">${(w.pasos||[]).map((p,i)=>`${i?"<em>→</em>":""}<span>${NOMP[p]?.split(" ")[0]||p}</span>`).join("")}</div>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto">${w.modo==="prueba"?`<div>${gauge(w.coinciden,w.no_coinciden)}<div class="sub" style="text-align:center">coinciden</div></div>`:`<div><div class="big" style="font-size:28px">${fmt(w.ejec)}</div><div class="sub">leads procesados</div></div>`}
    <div style="text-align:right"><div class="sub">${w.error} errores · ${w.esperando} esperando</div><button class="btn" style="margin-top:6px">${w.modo==="prueba"&&w.encendido?"Pasar a real":"Abrir"}</button></div></div></div>`).join("")}</div>`;
};
B.etiquetas = () => {
  const C=conDato(D.canales), tc=suma(C.map(c=>c.n)), sin=D.canales.find(c=>c.t==="Sin canal")?.n||0, tot=suma(D.canales.map(c=>c.n)), E=[...D.etiquetas].sort((a,b)=>b.n-a.n), maxE=Math.max(1,...E.map(e=>e.n)), te=suma(E.map(e=>e.n));
  return `<div class="insight"><div class="t">Lo que dicen tus etiquetas</div><div class="frase">«<b>${esc(E[0].t)}</b>» está en ${fmt(E[0].n)} leads${E[0].n>te-E[0].n?": más que todas las demás juntas":""}. <b>${esc([...C].sort((a,b)=>b.agendan-a.agendan)[0].t)}</b> es el canal que más agenda.</div><div class="mas"><span>${D.etiquetas.length} etiquetas · ${D.etiquetas.filter(e=>e.ghl).length} usadas por GHL</span><span>${fmt(sin)} leads (${pct(sin,tot,0)}) sin canal: el canal sale de la cita</span></div></div>
  <div class="rej">
   <div class="tarj c5"><p class="tit">Canales</p><div class="sub">De los ${fmt(tc)} leads con canal</div><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:12px">${dona(C,COLB,{r:58,g:18,centro:fmt(tc),sub:"con canal"})}<div style="flex:1;min-width:150px">${C.map((c,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 0"><i style="width:10px;height:10px;border-radius:3px;background:${COLB[i%6]}"></i><span style="color:var(--tx2)">${esc(c.t)}</span><b style="margin-left:auto">${pct(c.n,tc,0)}</b></div>`).join("")}</div></div></div>
   <div class="tarj c7"><p class="tit">Etiquetas por leads</p><div class="sub">Pulsa una para ver sus leads en KPIs → UTMs</div><div style="margin-top:10px">${E.map(e=>`<div style="display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 70px;gap:10px;align-items:center;padding:6px 0;cursor:pointer"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.t)}${e.ghl?' <span title="usada por GHL" style="color:#f59f00">●</span>':""}</span><div class="cuota"><i style="width:${e.n/maxE*100}%"></i></div><span style="text-align:right;font-weight:700">${e.n} <span class="sub">${pct(e.n,te,0)}</span></span></div>`).join("")}</div><div class="ley"><span><i style="background:#f59f00;border-radius:99px"></i>usada por GHL</span></div></div>
  </div>
  <div class="tarj"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center"><p class="tit">Gestionar</p><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn">Nueva etiqueta</button><button class="btn">Renombrar o unir</button><button class="btn">Editar canales</button></div></div><p class="nota">Las listas para editar (orden, renombrar, unir, borrar, alias y páginas de los canales) se abren desde aquí, en una ventana. Hacen lo mismo que hoy.</p></div>`;
};
B.utms = () => {
  const T=D.total, sinU=D.source.find(s=>s.t==="Sin dato")?.n||0, conU=T.leads-sinU, S=conDato(D.source), u7=suma(D.utm_dias.slice(-7).map(x=>x.n)), u0=suma(D.utm_dias.slice(-14,-7).map(x=>x.n));
  const ig=suma(S.filter(s=>/^(ig|instagram)$/i.test(s.t)).map(s=>s.n)), ag=suma(D.pares.map(p=>p.a)), desde=D.utm_dias.findIndex(x=>x.n>0);
  return `<div class="insight"><div class="t">El dato de la semana</div><div class="frase"><b>Instagram trae el ${pct(ig,conU,0)}</b> de los leads con UTM (sumando «ig» e «instagram»). Pero de ${conU} leads con UTM, solo <b>${ag} han agendado</b>.</div><div class="mas"><span>${fmt(sinU)} leads sin UTM (${pct(sinU,T.leads,0)}) · primer lead con UTM: ${D.utm_dias[desde]?.d}</span><span>Consejo: unir «ig» e «instagram» en una sola fuente</span></div></div>
  <div class="rej">
   <div class="tarj c3"><div class="lbl">Leads con UTM (7 días)</div><div class="big">${N(u7)}${delta(u7,u0)}</div><div class="sub">vs ${u0} la semana anterior</div></div>
   <div class="tarj c3"><div class="lbl">Con UTM (total)</div><div class="big">${N(conU)}</div><div class="sub">${pct(conU,T.leads)} de ${fmt(T.leads)}</div></div>
   <div class="tarj c3"><div class="lbl">Agendan</div><div class="big">${N(ag)}</div><div class="sub">${pct(ag,conU)} de los que traen UTM</div></div>
   <div class="tarj c3"><div class="lbl">Campañas activas</div><div class="big">${N(conDato(D.campaign).length)}</div><div class="sub">${conDato(D.source).length} fuentes · ${conDato(D.medium).length} medios</div></div>
  </div>
  <div class="rej">
   <div class="tarj c8"><p class="tit">Leads con UTM por día</p><div class="sub">Desde el primer lead con UTM</div>${area(D.utm_dias.slice(Math.max(0,desde-2)),{color:"#5b5bf6",color2:"#f0568c",rejilla:"#eef0f6",texto:"#8a91a8",id:"b"})}</div>
   <div class="tarj c4"><p class="tit">Fuentes</p><div class="sub">utm_source</div><div style="display:flex;justify-content:center;margin:10px 0">${dona(topN(S,5),COLB,{r:56,g:18,centro:conU,sub:"con UTM"})}</div>${topN(S,5).map((s,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px"><i style="width:10px;height:10px;border-radius:3px;background:${COLB[i]}"></i><span style="color:var(--tx2)">${esc(s.t)}</span><b style="margin-left:auto">${s.n}</b></div>`).join("")}</div>
  </div>
  <div class="tarj"><p class="tit">Campañas</p><div class="sub">Qué trae cada campaña y cuántos agendan</div><div style="overflow-x:auto;margin-top:8px"><table><thead><tr><th>Campaña</th><th>Fuente</th><th style="text-align:right">Leads</th><th class="solo-ancho">Cuota</th><th style="text-align:right">Agendan</th></tr></thead><tbody>
   ${[...D.pares].sort((a,b)=>b.n-a.n).map(p=>`<tr><td style="font-weight:600">${esc(p.c)}</td><td><span class="pill gris">${esc(p.s)}</span></td><td style="text-align:right;font-weight:700">${p.n}</td><td class="solo-ancho" style="width:160px"><div class="cuota"><i style="width:${p.n/conU*100}%"></i></div></td><td style="text-align:right">${p.a?`<span class="pill ok">${p.a}</span>`:'<span class="sub">0</span>'}</td></tr>`).join("")}
  </tbody></table></div></div>
  <div class="tarj" style="margin-top:16px"><p class="tit">Generador de enlaces · filtros · tabla de leads</p><p class="nota">Siguen debajo, igual que hoy (la tabla no sale en la maqueta: el repo es público).</p></div>`;
};

/* ---------- pintar ---------- */
const PEST=[["entradas","Entradas"],["workflows","Workflows"],["etiquetas","Etiquetas y UTMs"],["utms","UTMs (KPIs)"]];
let prop="A", pest="entradas";
function pintar(){
  document.body.className=prop;
  document.getElementById("seg-prop").innerHTML=[["A","A · Centro de control"],["B","B · Analytics"]].map(([v,t])=>`<button class="${v===prop?"on":""}" onclick="prop='${v}';pintar()">${t}</button>`).join("");
  document.getElementById("seg-pest").innerHTML=PEST.map(([v,t])=>`<button class="${v===pest?"on":""}" onclick="pest='${v}';pintar()">${t}</button>`).join("");
  const kpis=pest==="utms", titulo=kpis?"KPIs":"Administración";
  document.getElementById("raiz").innerHTML = prop==="A"
   ? `<div class="cab"><div><div class="ruta">Maestria / ${titulo} / ${PEST.find(p=>p[0]===pest)[1]}</div><h1>${PEST.find(p=>p[0]===pest)[1]}</h1></div><span class="vivo"><span class="led pulso"></span>En vivo · 11 nov 12:00</span></div><div class="pest">${PEST.map(([v,t])=>`<button class="${v===pest?"on":""}" onclick="pest='${v}';pintar()">${t}</button>`).join("")}</div>${A[pest]()}`
   : `<div class="hero"><div><div class="ruta">Maestria · ${titulo}</div><h1>${PEST.find(p=>p[0]===pest)[1]}</h1></div><div class="pest" style="margin:0">${PEST.map(([v,t])=>`<button class="${v===pest?"on":""}" onclick="pest='${v}';pintar()">${t}</button>`).join("")}</div></div>${B[pest]()}`;
  contar();
}
pintar();
</script>
</body>
</html>
