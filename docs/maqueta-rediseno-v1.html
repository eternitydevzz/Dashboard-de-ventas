  if(!tot) return `<div><div class="titulo-seccion">${titulo}</div><p class="mute">Todavía no hay datos.</p></div>`;
  const arcos = o.map((p,i)=>{ const l=p.n/tot*c; const s=`<circle cx="38" cy="38" r="${r}" fill="none" stroke="${COL[i%7]}" stroke-width="9" stroke-dasharray="${l} ${c-l}" stroke-dashoffset="${-ini}" transform="rotate(-90 38 38)"><title>${esc(p.t)}: ${fmt(p.n)}</title></circle>`; ini+=l; return s; }).join("");
  return `<div><div class="titulo-seccion" style="margin-bottom:10px">${titulo}</div><div class="anillo"><svg width="120" height="120" viewBox="0 0 76 76"><circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--borde)" stroke-width="9"/>${arcos}<text x="38" y="41" text-anchor="middle" font-size="12" font-weight="650" fill="var(--texto)">${fmt(tot)}</text></svg><ul>${o.map((p,i)=>`<li><i class="punto" style="color:${COL[i%7]}"></i><span class="tx" title="${esc(p.t)}">${esc(p.t)}</span><span class="n">${fmt(p.n)} · ${Math.round(p.n/tot*100)} %</span></li>`).join("")}</ul></div></div>`;
}

function barras(titulo, filas, max=8){
  const o = filas.filter(p=>p.n>0).slice(0,max), top = o[0]?.n||1, tot = filas.reduce((s,p)=>s+p.n,0);
  return `<div><div class="titulo-seccion" style="margin-bottom:6px">${titulo}</div>${o.length?o.map((p,i)=>`<div class="barra"><div class="fila"><b style="color:var(--texto-3);width:18px">${i+1}</b><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.t)}</span><span class="n">${fmt(p.n)} · ${pct(p.n,tot)}</span></div><div class="pista"><div class="lleno" style="width:${p.n/top*100}%"></div></div></div>`).join(""):'<p class="mute">Todavía no hay datos.</p>'}</div>`;
}

function mini(dias, w=140, h=36){
  const m = Math.max(1,...dias), bw = w/dias.length;
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Leads por día, últimos 14 días">${dias.map((n,i)=>`<rect x="${i*bw+1}" y="${h-(n/m)*(h-4)-2}" width="${bw-2}" height="${(n/m)*(h-4)+2}" rx="1.5" fill="${i===dias.length-1?'var(--primario)':'color-mix(in srgb,var(--primario) 45%,transparent)'}"><title>${n} leads</title></rect>`).join("")}</svg>`;
}

function linea(puntos){
  const w=700,h=180,p=24, m=Math.max(1,...puntos.map(x=>x.n)), sx=(w-2*p)/(puntos.length-1);
  const xy = puntos.map((x,i)=>[p+i*sx, h-p-(x.n/m)*(h-2*p)]);
  const d = xy.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" role="img" aria-label="Leads por día"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--primario)" stop-opacity=".35"/><stop offset="1" stop-color="var(--primario)" stop-opacity="0"/></linearGradient></defs>
  <path d="${d} L${xy.at(-1)[0]} ${h-p} L${p} ${h-p} Z" fill="url(#g)"/><path d="${d}" fill="none" stroke="var(--primario)" stroke-width="2.5" stroke-linejoin="round"/>
  ${xy.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="var(--primario)"><title>${puntos[i].d}: ${puntos[i].n} leads</title></circle>`).join("")}
  ${puntos.map((x,i)=> i%5===0||i===puntos.length-1?`<text x="${p+i*sx}" y="${h-4}" font-size="10" text-anchor="middle" fill="var(--texto-3)">${x.d}</text>`:"").join("")}
  <text x="${p}" y="12" font-size="10" fill="var(--texto-3)">máx. ${m}</text></svg>`;
}

function embudo(pasos){
  const tot=pasos[0].n, tonos=["var(--primario)","var(--oro)","var(--ok)"];
  return `<div class="embudo">${pasos.map((s,i)=>`${i?`<div class="entre">↓ ${pct(s.n,pasos[i-1].n)} pasa · se pierden ${fmt(pasos[i-1].n-s.n)}</div>`:""}<div class="pso" style="width:${30+70*Math.sqrt(tot?s.n/tot:0)}%;background:${tonos[i]}"><span>${s.t}</span><span>${fmt(s.n)} · ${pct(s.n,tot)}</span></div>`).join("")}</div>`;
}

function hace(iso){ if(!iso) return "nunca"; const m=(HOY-new Date(iso))/6e4; return m<60?`hace ${Math.round(m)} min`:m<1440?`hace ${Math.round(m/60)} h`:`hace ${Math.round(m/1440)} días`; }

function estadoEntrada(e){
  if(!e.activa) return `<span class="chip c-gris">Apagada</span>`;
  if(e.wf?.modo==="prueba") return `<span class="chip c-aviso">⚗ Workflow en prueba</span>`;
  if(e.wf?.modo==="real") return `<span class="chip c-ok"><i class="punto"></i>Lo manda su workflow</span>`;
  return `<span class="chip c-ok"><i class="punto"></i>Recibiendo</span>`;
}

const V = {};
V.entradas = () => {
  const E=D.entradas, hoy=E.reduce((s,e)=>s+e.dias.at(-1),0), sem=E.reduce((s,e)=>s+e.dias.slice(-7).reduce((a,b)=>a+b,0),0);
  return `<div class="fila" style="justify-content:space-between;margin-bottom:12px;flex-wrap:wrap"><div><div class="titulo-seccion">Entradas (landings)</div><div class="mute">Cada landing manda sus leads a su propia dirección.</div></div><button class="btn pri" onclick="abrirModal()">＋ Conectar una landing</button></div>
  <div class="kpis">${kpi("Leads hoy",fmt(hoy),`${fmt(sem)} en 7 días`,"↓","pri")}${kpi("Entradas activas",`${E.filter(e=>e.activa).length}<span class="mute" style="font-size:14px"> / ${E.length}</span>`,"recibiendo leads","●","ok")}${kpi("Envíos con error",fmt(E.reduce((s,e)=>s+e.errores,0)),"todo en orden","!","mal")}${kpi("Workflows en prueba",E.filter(e=>e.wf?.modo==="prueba").length,"esperan «Pasar a real»","⚗","aviso")}</div>
  <div class="grid2">${E.map(e=>`<article class="tarjeta tarjeta-e">
    <div class="fila" style="justify-content:space-between"><span class="nombre" title="${esc(e.nombre)}">${esc(e.nombre)}</span>${estadoEntrada(e)}</div>
    <div class="fila" style="align-items:flex-end;gap:14px"><div><div class="grande">${fmt(e.leads)}</div><div class="mute">leads · último ${hace(e.ultimo)}</div></div><div style="flex:1;min-width:0">${mini(e.dias)}<div class="mute" style="text-align:right">14 días · hoy ${e.dias.at(-1)}</div></div></div>
    ${e.wf?.modo==="prueba"?`<div class="fila" style="background:var(--aviso-suave);border-radius:12px;padding:7px 10px;flex-wrap:wrap"><span style="font-size:12px;color:var(--aviso-texto)">Comparando con «Qué hacer en GHL»</span><span style="margin-left:auto" class="fila"><button class="btn peq">Pasar a real</button><button class="btn peq">Parar la prueba</button></span></div>`:""}
    <div class="fila"><code class="mute" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">…/api/webhooks/entrada/••••••</code><button class="btn pri peq">Copiar dirección</button></div>
    <details><summary>Ver los últimos leads</summary><p>La misma lista de hoy (en la maqueta no se enseñan leads: el repo es público).</p></details>
    <details><summary>Cambiar ajustes y «Qué hacer en GHL»</summary><p>Los mismos campos de hoy.</p></details>
    <details><summary>Para el programador</summary><p>El JSON y el código de ejemplo de hoy.</p></details>
  </article>`).join("")}</div>`;
};

const PASO = {esperar:["⏱","Esperar","c-gris"],contacto_ghl:["👤","Contacto","c-aviso"],etiquetas_ghl:["🏷","Etiquetas","c-mal"],rama:["⑂","Rama","c-pri"],oportunidad_ghl:["💼","Oportunidad","c-oro"],mover_dashboard:["➜","Mover","c-ok"]};
let wfSel = 0;
V.workflows = () => {
  const W=D.workflows, real=W.filter(w=>w.modo==="real"&&w.encendido).length, prueba=W.filter(w=>w.modo==="prueba"&&w.encendido).length, off=W.filter(w=>!w.encendido).length, w=W[wfSel];
  const cn = (w.coinciden+w.no_coinciden);
  return `<div class="kpis">${kpi("Workflows",W.length,`${off} apagado`,"⚡","pri")}${kpi("En real",real,"mandan a GHL","✓","ok")}${kpi("En prueba",prueba,"comparando, sin mandar","⚗","aviso")}${kpi("Leads procesados",fmt(W.reduce((s,x)=>s+x.ejec,0)),"desde que existen","↻","pri")}${kpi("Con error",W.reduce((s,x)=>s+x.error,0),"todo en orden","!","mal")}</div>
  <div class="grid3 dos" style="grid-template-columns:minmax(280px,1fr) minmax(300px,1.3fr);align-items:start">
   <div style="display:flex;flex-direction:column;gap:10px">${W.map((x,i)=>`<article class="tarjeta tarjeta-e wf ${i===wfSel?"sel":""}" onclick="wfSel=${i};pintar()">
     <div class="fila" style="justify-content:space-between"><span class="nombre">${esc(x.nombre)}</span><span class="fila" style="gap:6px;flex-shrink:0">${!x.encendido?'<span class="chip c-gris">Apagado</span>':x.modo==="real"?'<span class="chip c-ok"><i class="punto"></i>Real</span>':'<span class="chip c-aviso">⚗ En prueba</span>'}<button class="ib" title="Editar el workflow" aria-label="Editar ${esc(x.nombre)}" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></button><button class="ib mal" title="Eliminar el workflow (pide confirmación)" aria-label="Eliminar ${esc(x.nombre)}" onclick="event.stopPropagation();confirm('¿Eliminar «${esc(x.nombre)}»?')&&confirm('Segunda confirmación: «${esc(x.nombre)}» se borrará para siempre y sus ${x.esperando} leads en espera no seguirán. ¿Seguro? (en la maqueta no borra nada)')"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span></div>
     <div class="pasos">${(x.pasos||[]).map((p,j)=>`${j?'<span class="flecha">›</span>':""}<span class="paso" title="${PASO[p]?.[1]||p}">${PASO[p]?.[0]||"•"}</span>`).join("")}</div>
     <div class="fila mute"><b style="color:var(--texto)">${fmt(x.ejec)}</b> leads · ${x.error} con error · ${x.esperando} esperando</div></article>`).join("")}</div>
   <div class="tarjeta seccion" style="position:sticky;top:12px">
     <div class="fila" style="justify-content:space-between;flex-wrap:wrap"><div><div class="nombre">${esc(w.nombre)}</div><div class="mute">${w.modo==="real"?"Real: manda a GHL en lugar de «Qué hacer en GHL»":"En prueba: hace lo mismo sin mandar nada y lo compara"}</div></div>
     ${w.modo==="prueba"?`<div class="fila">${anilloMini(w.coinciden,w.no_coinciden)}<div class="mute">${cn?`${w.coinciden} de ${cn} coinciden`:"Aún sin leads para comparar"}</div></div>`:""}</div>
     <div class="diagrama" style="margin-top:14px"><div class="nodo"><span class="ico c-pri">⚡</span><div><div class="mute">Cuando</div><b>${w.disparador==="cita"?"Se agenda una cita":"Llega un lead a la Entrada"}</b></div></div>${(w.pasos||[]).map(p=>`<div class="linea"></div><div class="nodo"><span class="ico ${PASO[p]?.[2]||"c-gris"}">${PASO[p]?.[0]||"•"}</span><b>${PASO[p]?.[1]||p}</b></div>`).join("")}</div>
     <p class="nota" style="text-align:center">Al abrirlo se ve el diagrama completo de hoy, con los detalles de cada paso.</p>
   </div></div>`;
};
function anilloMini(a,b){ const t=a+b, r=14, c=2*Math.PI*r, l=t?a/t*c:0; return `<svg width="40" height="40" viewBox="0 0 36 36"><circle cx="18" cy="18" r="${r}" fill="none" stroke="${t?'var(--mal)':'var(--borde)'}" stroke-width="5"/><circle cx="18" cy="18" r="${r}" fill="none" stroke="var(--ok)" stroke-width="5" stroke-dasharray="${l} ${c-l}" transform="rotate(-90 18 18)"/></svg>`; }

let subEt = "canales";
V.etiquetas = () => {
  const C=D.canales, tot=C.reduce((s,c)=>s+c.n,0), sin=C.find(c=>c.t==="Sin canal")?.n||0, con=C.filter(c=>!SIN.includes(c.t)), E=D.etiquetas, maxE=Math.max(1,...E.map(e=>e.n));
  return `<div class="tarjeta aviso-sin"><span class="ico c-aviso" style="width:32px;height:32px;font-size:15px">!</span><div><b>${fmt(sin)} de ${fmt(tot)} leads (${pct(sin,tot)}) no tienen canal.</b><div class="mute">El canal sale de la cita (de su página o su utm_source), así que solo lo tienen los que agendaron. Se cuentan aparte para que los círculos se lean.</div></div></div>
  <div class="grid3">
   <div class="tarjeta seccion">${anillo("Leads por canal",con)}</div>
   <div class="tarjeta seccion">${anillo("Leads por etiqueta",E)}</div>
   <div class="tarjeta seccion">${barras("Ranking de canales",con,8)}</div>
  </div>
  <div class="sub-pest"><button class="${subEt==="canales"?"on":""}" onclick="subEt='canales';pintar()">Canales</button><button class="${subEt==="etiquetas"?"on":""}" onclick="subEt='etiquetas';pintar()">Etiquetas</button></div>
  <div class="tarjeta seccion lista-ed">${subEt==="canales"
   ? `<div class="mute" style="margin-bottom:10px">Se editan igual que hoy (nombre, alias y páginas); cada fila enseña además sus leads.</div>${C.filter(c=>c.t!=="Sin canal").map(c=>`<div class="item"><span class="flecha">⇅</span><b style="min-width:110px">${esc(c.t)}</b><span class="mini"><i style="width:${c.n/Math.max(...con.map(x=>x.n))*100}%"></i></span><span class="mute">${fmt(c.n)} leads</span><span style="margin-left:auto" class="fila"><button class="btn peq">Editar</button></span></div>`).join("")}`
   : `<div class="fila" style="margin-bottom:10px"><input class="campo" style="margin:0;max-width:260px" placeholder="nueva etiqueta"><button class="btn peq">Crear</button></div>${E.map(e=>`<div class="item"><span class="flecha">⇅</span><b style="min-width:170px">${esc(e.t)}</b>${e.ghl?'<span class="chip c-oro">usada por GHL</span>':'<span class="chip c-gris">solo aquí</span>'}<span class="mini"><i style="width:${e.n/maxE*100}%"></i></span><span class="mute">${fmt(e.n)} leads</span><span style="margin-left:auto" class="fila"><button class="btn peq">Ver en UTMs</button><button class="btn peq">Renombrar o unir</button><button class="btn peq">Borrar</button></span></div>`).join("")}`}</div>`;
};

let canalEmb = "Todos";
V.utms = () => {
  const T=D.total, sinU=D.source.find(s=>s.t==="Sin dato")?.n||0, conU=T.leads-sinU, sinD=a=>a.filter(x=>!SIN.includes(x.t));
  const con = sinD(D.source), c = canalEmb==="Todos"?{n:T.leads,agendan:T.agendan,compran:T.compran}:D.source.find(x=>x.t===canalEmb);
  return `<div class="kpis">${kpi("Leads",fmt(T.leads),"todo el histórico","👥","pri")}${kpi("Con UTM",fmt(conU),pct(conU,T.leads)+" del total","🔗","ok")}${kpi("Sin UTM",fmt(sinU),"se cuentan aparte","∅","aviso")}${kpi("Agendan",fmt(T.agendan),pct(T.agendan,T.leads),"📅","oro")}${kpi("Compran",fmt(T.compran),pct(T.compran,T.leads),"€","ok")}</div>
  <div class="grid3">
   <div class="tarjeta seccion">${anillo("Por utm_source",sinD(D.source))}</div>
   <div class="tarjeta seccion">${anillo("Por campaña",sinD(D.campaign))}</div>
   <div class="tarjeta seccion">${anillo("Por etiqueta",D.etiquetas)}</div>
  </div>
  <div class="tarjeta seccion"><div class="fila" style="justify-content:space-between"><div class="titulo-seccion">Leads por día · últimos 30 días</div><span class="mute">${fmt(D.dias30.reduce((s,x)=>s+x.n,0))} en total</span></div>${linea(D.dias30)}<p class="nota">El pico de ${fmt(Math.max(...D.dias30.map(x=>x.n)))} leads en un solo día aplasta el resto. Cómo enseñarlo está pendiente de decidir con Cristian.</p></div>
  <div class="grid3" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
   <div class="tarjeta seccion"><div class="fila" style="justify-content:space-between;flex-wrap:wrap;margin-bottom:10px"><div class="titulo-seccion">Embudo por utm_source</div><select class="campo" style="width:auto;margin:0" onchange="canalEmb=this.value;pintar()">${["Todos",...con.map(x=>x.t)].map(t=>`<option ${t===canalEmb?"selected":""}>${esc(t)}</option>`).join("")}</select></div>
     ${embudo([{t:"Leads",n:c.n},{t:"Agendan",n:c.agendan},{t:"Compran",n:c.compran}])}
     <p class="nota">En la app irán los 6 pasos de KPIs → Leads (Contactados, Contestan y Asisten también). En la maqueta solo están los 3 que pude contar directo en la base. Hoy casi nadie con UTM ha agendado: por eso, al elegir una fuente, el embudo sale casi vacío (es el dato real).</p></div>
   <div class="tarjeta seccion">${barras("Ranking de campañas (con UTM)",sinD(D.campaign),8)}</div>
  </div>
  <div class="tarjeta seccion"><div class="titulo-seccion">Generador de enlaces · filtros · tabla de leads</div><p class="mute">Siguen igual que hoy, debajo de los gráficos. (En la maqueta no se enseña la tabla: el repo es público).</p></div>`;
};

const PEST = [["entradas","Entradas (landings)","Administración"],["workflows","Workflows","Administración"],["etiquetas","Etiquetas y UTMs","Administración"],["utms","UTMs (KPIs)","KPIs"]];
let pest = "entradas";
function pintar(){
  document.getElementById("pestanas").innerHTML = PEST.map(([v,t])=>`<button class="${v===pest?"on":""}" onclick="pest='${v}';pintar()">${t}</button>`).join("")+`<button class="tema" onclick="document.documentElement.classList.toggle('dark')">◐ Claro / oscuro</button>`;
  const p = PEST.find(x=>x[0]===pest);
  document.getElementById("h1").textContent = p[2];
  document.getElementById("subt").textContent = p[2]==="KPIs" ? "Maestria · UTMs · Todo el histórico" : "Maestria · acceso total";
  document.getElementById("vista").innerHTML = V[pest]();
}
function abrirModal(){document.getElementById("modal").classList.add("on")}
function cerrarModal(){document.getElementById("modal").classList.remove("on")}
pintar();
</script>
</body>
</html>
